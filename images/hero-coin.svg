<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa0ff"/><stop offset=".5" stop-color="#394ff0"/><stop offset="1" stop-color="#1a2590"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7ff"/><stop offset=".5" stop-color="#7d8dff"/><stop offset="1" stop-color="#3b49c8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a37b5"/><stop offset="1" stop-color="#121a63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6b7bff" stop-opacity=".55"/><stop offset="1" stop-color="#6b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#9aa6ff" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <!-- هاله‌ی نور پشت سکه -->
  <circle cx="220" cy="225" r="215" fill="url(#aura)"/>

  <!-- سکه‌ی کوچیک پشتی -->
  <g transform="translate(345 105) rotate(18)">
    <circle cx="5" cy="9" r="62" fill="url(#edge)"/>
    <circle r="62" fill="url(#rim)"/>
    <circle r="50" fill="url(#face)"/>
    <circle r="40" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <!-- سکه‌ی کوچیک پایین -->
  <g transform="translate(95 345) rotate(-24)">
    <circle cx="5" cy="8" r="52" fill="url(#edge)"/>
    <circle r="52" fill="url(#rim)"/>
    <circle r="42" fill="url(#face)"/>
    <circle r="33" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <!-- سکه‌ی اصلی -->
  <g transform="translate(215 225) rotate(-14)">
    <circle cx="12" cy="18" r="150" fill="url(#edge)"/>
    <circle r="150" fill="url(#rim)"/>
    <circle r="128" fill="url(#face)"/>
    <circle r="112" stroke="#fff" stroke-opacity=".35" stroke-width="2.5"/>
    <circle r="104" stroke="#fff" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="3 7"/>
    <!-- حروف CP -->
    <g transform="translate(-2 2) scale(1.38)" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 3 -24 A 38 38 0 1 0 3 24" transform="translate(-14 0)"/>
      <path d="M 22 -36 V 36 M 22 -36 H 38 A 20 20 0 0 1 38 4 H 22" transform="translate(-2 0)"/>
    </g>
    <!-- بازتاب نور -->
    <path d="M -110 -40 A 118 118 0 0 1 20 -116 A 150 150 0 0 0 -110 -40 Z" fill="url(#shine)"/>
    <ellipse cx="-62" cy="-82" rx="26" ry="9" transform="rotate(-38 -62 -82)" fill="#fff" fill-opacity=".5"/>
  </g>

  <!-- شیشه‌ی معلق -->
  <rect x="318" y="262" width="92" height="92" rx="22" transform="rotate(14 364 308)" fill="url(#glass)" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- جرقه‌ها -->
  <g fill="#fff">
    <path d="M60 120 l5 17 17 5 -17 5 -5 17 -5 -17 -17 -5 17 -5z" fill-opacity=".9"/>
    <path d="M395 215 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z" fill-opacity=".8"/>
    <path d="M250 40 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill-opacity=".7"/>
    <circle cx="150" cy="60" r="3.5" fill-opacity=".6"/>
    <circle cx="410" cy="360" r="3" fill-opacity=".5"/>
  </g>
</svg>
